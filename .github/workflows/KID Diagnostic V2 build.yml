name: Build KID Diagnostic V2 Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - codex/v2-modern-dashboard
    paths:
      - "versiune-v2/**"
      - "*.py"
      - "requirements.txt"
      - ".github/workflows/KID Diagnostic V2 build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "versiune-v2/**"
      - "*.py"
      - "requirements.txt"
      - ".github/workflows/KID Diagnostic V2 build.yml"

permissions:
  contents: write

jobs:
  build-v2:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.21.0 pillow

      - name: Create KID Diagnostic icon
        shell: powershell
        run: |
          @'
          from PIL import Image, ImageDraw, ImageFont
          S=512
          im=Image.new('RGBA',(S,S),(4,16,31,255))
          d=ImageDraw.Draw(im)
          d.ellipse((18,18,S-18,S-18), fill=(5,25,48,255), outline=(170,190,210,255), width=18)
          d.ellipse((36,36,S-36,S-36), outline=(0,155,255,255), width=14)
          d.rounded_rectangle((105,150,407,255), radius=45, outline=(45,180,255,255), width=12)
          d.line((150,150,205,105,310,105,362,150), fill=(205,225,240,255), width=12)
          d.ellipse((125,225,185,285), fill=(2,12,25,255), outline=(0,160,255,255), width=8)
          d.ellipse((327,225,387,285), fill=(2,12,25,255), outline=(0,160,255,255), width=8)
          try:
              f1=ImageFont.truetype('C:/Windows/Fonts/arialbd.ttf',105)
              f2=ImageFont.truetype('C:/Windows/Fonts/arialbd.ttf',42)
          except:
              f1=f2=None
          box=d.textbbox((0,0),'KID',font=f1)
          d.text(((S-(box[2]-box[0]))//2,278),'KID',font=f1,fill=(235,242,250,255),stroke_width=3,stroke_fill=(0,110,230,255))
          box=d.textbbox((0,0),'DIAGNOSTIC',font=f2)
          d.text(((S-(box[2]-box[0]))//2,385),'DIAGNOSTIC',font=f2,fill=(70,185,255,255))
          im.save('kid_diagnostic_v2.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | Set-Content make_v2_icon.py
          python make_v2_icon.py

      - name: Validate V2 source
        id: validate
        continue-on-error: true
        run: |
          python -m py_compile versiune-v2/main_v2.py versiune-v2/ui_v2.py versiune-v2/dtc_reference_index_pack.py versiune-v2/obd_reference_index_pack.py versiune-v2/v2_diagnostic_patch.py versiune-v2/v2_ui_runtime_patch.py versiune-v2/v2_master_ui_patch.py versiune-v2/v2_visual_fix.py versiune-v2/v2_redesign_patch.py autoscan_parser.py ui_autoscan_pdf_export.py

      - name: Smoke test redesigned V2 UI
        id: smoke
        continue-on-error: true
        shell: powershell
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          @'
          import sys
          from pathlib import Path
          root = Path.cwd(); v2 = root / 'versiune-v2'
          sys.path.insert(0, str(root)); sys.path.insert(0, str(v2))
          import main_v2
          main_v2.prepare_database()
          from v2_diagnostic_patch import apply as p1
          from v2_ui_runtime_patch import apply as p2
          from v2_master_ui_patch import apply as p3
          from v2_visual_fix import apply as p4
          from v2_redesign_patch import apply as p5
          p1(); p2(); p3(); p4(); p5()
          from PySide6.QtWidgets import QApplication
          from ui_v2 import MainWindowV2
          app = QApplication([])
          win = MainWindowV2(); win.resize(1540, 920); win.show(); app.processEvents()
          assert win.stack.count() == 9
          assert win.width() >= 1180
          shot = win.grab(); assert shot.save('v2_ui_preview.png', 'PNG')
          print('V2 UI smoke test OK:', win.windowTitle(), 'pages=', win.stack.count(), 'preview=', shot.size())
          win.close(); app.quit()
          '@ | Set-Content smoke_v2_ui.py
          python smoke_v2_ui.py

      - name: Upload V2 UI preview
        if: steps.smoke.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: KID-Diagnostic-V2-UI-Preview
          path: v2_ui_preview.png
          if-no-files-found: error

      - name: Build V2 executable
        id: build
        continue-on-error: true
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name KID-Diagnostic-V2 --icon kid_diagnostic_v2.ico --paths . --paths versiune-v2 --hidden-import ui_v2 --hidden-import dtc_reference_index_pack --hidden-import obd_reference_index_pack --hidden-import v2_diagnostic_patch --hidden-import v2_ui_runtime_patch --hidden-import v2_master_ui_patch --hidden-import v2_visual_fix --hidden-import v2_redesign_patch --collect-all pypdf versiune-v2/main_v2.py

      - name: Verify executable
        id: verify
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: powershell
        run: |
          if (-not (Test-Path "dist\KID-Diagnostic-V2.exe")) { exit 1 }
          $file = Get-Item "dist\KID-Diagnostic-V2.exe"
          Write-Host "EXE: $($file.FullName)"
          Write-Host "SIZE: $($file.Length) bytes"

      - name: Upload V2 Windows EXE
        if: steps.verify.outcome == 'success' && steps.smoke.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: KID-Diagnostic-V2-Windows
          path: dist/KID-Diagnostic-V2.exe
          if-no-files-found: error

      - name: Publish build result into repository
        if: always() && github.event_name == 'push'
        shell: powershell
        env:
          VALIDATE_RESULT: ${{ steps.validate.outcome }}
          SMOKE_RESULT: ${{ steps.smoke.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          VERIFY_RESULT: ${{ steps.verify.outcome }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPOSITORY: ${{ github.repository }}
        run: |
          @'
          import os
          from pathlib import Path
          from datetime import datetime, timezone
          validate=os.environ.get('VALIDATE_RESULT','unknown'); smoke=os.environ.get('SMOKE_RESULT','unknown')
          build=os.environ.get('BUILD_RESULT','unknown'); verify=os.environ.get('VERIFY_RESULT','unknown')
          ok=validate==smoke==build==verify=='success'; status='SUCCESS' if ok else 'FAILED'
          exe=Path('dist/KID-Diagnostic-V2.exe'); size=exe.stat().st_size if exe.exists() else 0
          repo=os.environ.get('REPOSITORY','fdani94/VAG-MASTER-DIAGNOSTIC-PRO'); run_id=os.environ.get('RUN_ID','')
          run_url=f'https://github.com/{repo}/actions/runs/{run_id}' if run_id else ''
          text=f'''# KID Diagnostic V2 — Build Status\n\n**Status:** {status}\n\n- Source commit: `{os.environ.get("SOURCE_SHA","")}`\n- Validate source: **{validate}**\n- UI smoke test: **{smoke}**\n- PyInstaller build: **{build}**\n- Verify EXE: **{verify}**\n- Executable: `KID-Diagnostic-V2.exe`\n- EXE size: **{size} bytes**\n- Artifact: `KID-Diagnostic-V2-Windows` (when status is SUCCESS)\n- Workflow run: {run_url}\n- Run attempt: {os.environ.get("RUN_ATTEMPT","")}\n- Updated UTC: {datetime.now(timezone.utc).isoformat(timespec="seconds")}\n'''
          Path('versiune-v2/BUILD_STATUS.md').write_text(text,encoding='utf-8')
          '@ | Set-Content write_build_status.py
          python write_build_status.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "versiune-v2/BUILD_STATUS.md"
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Update V2 Windows build status [skip ci]"
            git push
          }

      - name: Fail workflow when V2 build failed
        if: always() && (steps.validate.outcome != 'success' || steps.smoke.outcome != 'success' || steps.build.outcome != 'success' || steps.verify.outcome != 'success')
        shell: powershell
        run: exit 1
