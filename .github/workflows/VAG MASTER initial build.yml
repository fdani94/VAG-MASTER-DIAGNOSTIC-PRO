name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name VAG-MASTER-Diagnostic-PRO --collect-all PySide6 main.py

      - name: Create ZIP
        shell: powershell
        run: |
          Compress-Archive -Path dist/VAG-MASTER-Diagnostic-PRO/* -DestinationPath VAG-MASTER-Diagnostic-PRO-Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VAG-MASTER-Diagnostic-PRO-Windows
          path: VAG-MASTER-Diagnostic-PRO-Windows.zip
