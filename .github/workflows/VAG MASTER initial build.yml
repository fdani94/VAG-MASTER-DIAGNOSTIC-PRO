name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6==6.11.1
          pip install pyinstaller==6.21.0

      - name: Validate source
        run: |
          python -m py_compile main.py

      - name: Build Windows executable
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name VAG-MASTER-Diagnostic-PRO main.py

      - name: Check output
        shell: powershell
        run: |
          Get-ChildItem -Recurse dist
          if (-not (Test-Path "dist\VAG-MASTER-Diagnostic-PRO.exe")) { exit 1 }

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: VAG-MASTER-Diagnostic-PRO-Windows
          path: dist/VAG-MASTER-Diagnostic-PRO.exe
          if-no-files-found: error
