name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PySide6==6.8.3" "pyinstaller==6.15.0"

      - name: Validate Python source
        run: python -m py_compile main.py

      - name: Build single EXE
        run: python -m PyInstaller --noconfirm --clean --windowed --onefile --name VAG-MASTER-Diagnostic-PRO main.py

      - name: Verify EXE
        shell: powershell
        run: |
          if (!(Test-Path "dist/VAG-MASTER-Diagnostic-PRO.exe")) { throw "EXE not created" }
          Get-Item "dist/VAG-MASTER-Diagnostic-PRO.exe"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: VAG-MASTER-Diagnostic-PRO-Windows
          path: dist/VAG-MASTER-Diagnostic-PRO.exe
          if-no-files-found: error
