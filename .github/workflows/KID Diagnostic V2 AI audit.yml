name: KID Diagnostic V2 AI Audit

on:
  push:
    branches:
      - feature/v2-ai-copilot-audit

concurrency:
  group: kid-v2-ai-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-windows:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check pyinstaller==6.22.2 pillow
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile V2 and AI integration
        shell: powershell
        run: |
          python -m py_compile autoscan_parser.py ui_autoscan_pdf_export.py `
            versiune-v2/main_v2.py versiune-v2/ui_v2.py versiune-v2/final_validation.py `
            versiune-v2/v2_diagnostic_patch.py versiune-v2/v2_ui_runtime_patch.py `
            versiune-v2/v2_master_ui_patch.py versiune-v2/v2_visual_fix.py `
            versiune-v2/v2_redesign_patch.py versiune-v2/v2_responsive_windows_patch.py `
            versiune-v2/v2_functional_windows_patch.py versiune-v2/v2_pdf_fix_patch.py `
            versiune-v2/v2_integrated_navigation_patch.py versiune-v2/v2_pdf_report.py `
            versiune-v2/v2_ai_copilot.py versiune-v2/v2_ai_ui_patch.py `
            versiune-v2/v2_ai_pdf_patch.py versiune-v2/test_v2_ai_copilot.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run existing Auto-Scan regression tests
        shell: powershell
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run V2 AI Copilot regression tests
        shell: powershell
        run: |
          python versiune-v2/test_v2_ai_copilot.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run strict V2 functional validation
        shell: powershell
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python versiune-v2/final_validation.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create KID Diagnostic V2 icon
        shell: powershell
        run: |
          @'
          from PIL import Image, ImageDraw, ImageFont
          S=512
          im=Image.new('RGBA',(S,S),(235,244,250,255))
          d=ImageDraw.Draw(im)
          d.rounded_rectangle((18,18,S-18,S-18), radius=105, fill=(255,255,255,255), outline=(66,151,217,255), width=18)
          d.rounded_rectangle((105,150,407,255), radius=45, outline=(45,148,220,255), width=12)
          d.line((150,150,205,105,310,105,362,150), fill=(71,116,150,255), width=12)
          d.ellipse((125,225,185,285), fill=(242,248,252,255), outline=(40,142,215,255), width=8)
          d.ellipse((327,225,387,285), fill=(242,248,252,255), outline=(40,142,215,255), width=8)
          try:
              f1=ImageFont.truetype('C:/Windows/Fonts/arialbd.ttf',105)
              f2=ImageFont.truetype('C:/Windows/Fonts/arialbd.ttf',42)
          except Exception:
              f1=f2=None
          box=d.textbbox((0,0),'KID',font=f1)
          d.text(((S-(box[2]-box[0]))//2,278),'KID',font=f1,fill=(28,63,91,255),stroke_width=2,stroke_fill=(94,171,224,255))
          box=d.textbbox((0,0),'DIAGNOSTIC',font=f2)
          d.text(((S-(box[2]-box[0]))//2,385),'DIAGNOSTIC',font=f2,fill=(42,137,203,255))
          im.save('kid_diagnostic_v2.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | Set-Content make_v2_ai_icon.py
          python make_v2_ai_icon.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build KID Diagnostic V2 AI executable
        shell: powershell
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name KID-Diagnostic-V2-AI `
            --icon kid_diagnostic_v2.ico `
            --paths . --paths versiune-v2 `
            --hidden-import ui_v2 `
            --hidden-import dtc_reference_index_pack `
            --hidden-import obd_reference_index_pack `
            --hidden-import v2_diagnostic_patch `
            --hidden-import v2_ui_runtime_patch `
            --hidden-import v2_master_ui_patch `
            --hidden-import v2_visual_fix `
            --hidden-import v2_redesign_patch `
            --hidden-import v2_responsive_windows_patch `
            --hidden-import v2_functional_windows_patch `
            --hidden-import v2_pdf_fix_patch `
            --hidden-import v2_integrated_navigation_patch `
            --hidden-import v2_pdf_report `
            --hidden-import v2_ai_copilot `
            --hidden-import v2_ai_ui_patch `
            --hidden-import v2_ai_pdf_patch `
            --collect-all pypdf `
            --collect-all reportlab `
            versiune-v2/main_v2.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-Item "dist\KID-Diagnostic-V2-AI.exe"
          if ($exe.Length -lt 10000000) { throw "EXE V2 AI pare invalid: $($exe.Length) bytes" }

      - name: Run compiled smoke validation
        shell: powershell
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath "dist\KID-Diagnostic-V2-AI.exe" -ArgumentList "--compiled-smoke" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Compiled smoke a eșuat cu cod $($p.ExitCode)" }

      - name: Verify normal packaged startup
        shell: powershell
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath "dist\KID-Diagnostic-V2-AI.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "EXE V2 AI s-a închis prematur cu cod $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force

      - name: Ensure Inno Setup
        shell: powershell
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          if (-not (Test-Path $iscc)) { throw "Inno Setup nu este disponibil." }

      - name: Build V2 installer
        shell: powershell
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" versiune-v2\installer_v2_ai.iss'

      - name: Verify hashes
        shell: powershell
        run: |
          $exe = Resolve-Path "dist\KID-Diagnostic-V2-AI.exe"
          $setup = Resolve-Path "versiune-v2\dist-v2-installer\KID-Diagnostic-V2-AI-v2.1.0-Setup.exe"
          if ((Get-Item $setup).Length -lt 10000000) { throw "Installer V2 AI pare invalid." }
          $exeHash = Get-FileHash $exe -Algorithm SHA256
          $setupHash = Get-FileHash $setup -Algorithm SHA256
          @(
            "$($exeHash.Hash)  KID-Diagnostic-V2-AI.exe",
            "$($setupHash.Hash)  KID-Diagnostic-V2-AI-v2.1.0-Setup.exe"
          ) | Set-Content -Encoding ASCII "SHA256SUMS-KID-V2-AI.txt"
          Get-Content "SHA256SUMS-KID-V2-AI.txt"

      - name: Upload audited V2 package
        uses: actions/upload-artifact@v6
        with:
          name: KID-DIAGNOSTIC-V2-AI-AUDIT
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/KID-Diagnostic-V2-AI.exe
            versiune-v2/dist-v2-installer/KID-Diagnostic-V2-AI-v2.1.0-Setup.exe
            SHA256SUMS-KID-V2-AI.txt
            v2_final_*.png
            KID_Diagnostic_FINAL_TEST.pdf
